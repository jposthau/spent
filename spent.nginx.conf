# Nginx site config for Spent
# Deploy: sudo cp spent.nginx.conf /etc/nginx/sites-available/spent
#         sudo nginx -t && sudo systemctl reload nginx
#
# After DNS is pointing to your Pi, get SSL:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

server {
    listen 80;
    server_name _;   # matches any hostname, including bare IP — good for local testing

    # ── React static files ───────────────────────────────────────────────────
    root  /home/jordan/spent/static;
    index index.html;

    # SPA routing — any path that isn't a real file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Spring Boot API proxy ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OAuth2 initiation  (/oauth2/authorization/google)
    location /oauth2/ {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OAuth2 callback    (/login/oauth2/code/google)
    location /login/ {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
